name: Compiled Experiment execute
description: Reuse the existing execute boundary with explicit JSON parameters.
inputs:
  parameters:
    description: Reviewed argument map; execution and publication authority remain separate.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMPONENT_PARAMETERS: ${{ inputs.parameters }}
      run: python "$GITHUB_ACTION_PATH/../../../scripts/lifecycle_component.py" execute
