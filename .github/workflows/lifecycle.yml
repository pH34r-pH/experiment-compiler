name: Experiment Compiler lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify POC (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests including historical checksum and hostile inputs
        run: python -m unittest discover -s tests -v
      - name: Exercise self-contained reproduction source and report closure
        run: |
          set -euo pipefail
          cd examples/linear-regression-v1/source
          python reproduce.py --output-dir "$RUNNER_TEMP/linear-reproduction"
          sha256sum README.md data.csv DATA-LICENSE.md environment.json experiment-config.json acceptance.json protocol.md run_experiment.py test_experiment.py reproduce.py expected-result.json
          cat "$RUNNER_TEMP/linear-reproduction/reproduction-receipt.json"

      - name: Build twice and compare exact published POC
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/issue-164/experiment.json --receipt dist/build-receipt.json
          python -m experiment_compiler compile examples/issue-164/experiment.json --output "$RUNNER_TEMP/rebuilt.zip"
          cmp dist/issue-164-experiment-package.zip "$RUNNER_TEMP/rebuilt.zip"
          python -m experiment_compiler verify dist/issue-164-experiment-package.zip --recipe examples/issue-164/experiment.json --receipt dist/verification.json
          sha256sum dist/issue-164-experiment-package.zip > dist/SHA256SUMS
          cat dist/build-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build and exercise installed wheel outside source checkout
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/compiler-install"
          "$RUNNER_TEMP/compiler-install/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/issue-164/experiment.json" --output "$RUNNER_TEMP/installed-poc.zip"
          cmp "$GITHUB_WORKSPACE/dist/issue-164-experiment-package.zip" "$RUNNER_TEMP/installed-poc.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-poc.zip" --recipe "$GITHUB_WORKSPACE/examples/issue-164/experiment.json"
      - name: Retain compiled package, wheel and scoped receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-experiment-poc-python-${{ matrix.python }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
