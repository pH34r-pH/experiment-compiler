name: Experiment Compiler lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and reproduce Compiled Experiments (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests including historical checksum and hostile inputs
        run: python -m unittest discover -s tests -v
      - name: Exercise self-contained scientific source
        run: |
          set -euo pipefail
          cd examples/linear-regression-v1/source
          python reproduce.py --output-dir "$RUNNER_TEMP/source-reproduction"
          cat "$RUNNER_TEMP/source-reproduction/reproduction-receipt.json"

      - name: Compile, verify, extract and independently reproduce compiled-experiment-v1
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output dist/stdlib-linear-regression-v1-compiled-experiment.zip \
            --receipt dist/linear-build-receipt.json
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output "$RUNNER_TEMP/linear-rebuilt.zip"
          cmp dist/stdlib-linear-regression-v1-compiled-experiment.zip "$RUNNER_TEMP/linear-rebuilt.zip"
          python -m experiment_compiler verify dist/stdlib-linear-regression-v1-compiled-experiment.zip \
            --recipe examples/linear-regression-v1/experiment.json \
            --receipt dist/linear-verification.json
          mkdir -p "$RUNNER_TEMP/compiled-experiment"
          python -m zipfile -e dist/stdlib-linear-regression-v1-compiled-experiment.zip "$RUNNER_TEMP/compiled-experiment"
          cd "$RUNNER_TEMP/compiled-experiment/experiment"
          python reproduce.py --output-dir "$RUNNER_TEMP/package-reproduction"
          cmp "$RUNNER_TEMP/package-reproduction/result.json" "$RUNNER_TEMP/compiled-experiment/evidence/expected-result.json"
          cp "$RUNNER_TEMP/package-reproduction/result.json" "$GITHUB_WORKSPACE/dist/linear-reproduction-result.json"
          cp "$RUNNER_TEMP/package-reproduction/reproduction-receipt.json" "$GITHUB_WORKSPACE/dist/linear-reproduction-receipt.json"
          sha256sum "$GITHUB_WORKSPACE/dist/stdlib-linear-regression-v1-compiled-experiment.zip"
          cat "$GITHUB_WORKSPACE/dist/linear-reproduction-receipt.json"

      - name: Validate open-standard metadata with current reference validators
        if: matrix.python == '3.11'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/standards-validator"
          "$RUNNER_TEMP/standards-validator/bin/python" -m pip install --disable-pip-version-check \
            mlcroissant==1.1.0 roc-validator==0.10.0
          "$RUNNER_TEMP/standards-validator/bin/mlcroissant" validate \
            --jsonld "$RUNNER_TEMP/compiled-experiment/metadata/croissant.jsonld" \
            | tee dist/croissant-validation.txt
          "$RUNNER_TEMP/standards-validator/bin/rocrate-validator" validate \
            "$RUNNER_TEMP/compiled-experiment" \
            | tee dist/rocrate-validation.txt

      - name: Build twice and compare exact published POC
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/issue-164/experiment.json --receipt dist/build-receipt.json
          python -m experiment_compiler compile examples/issue-164/experiment.json --output "$RUNNER_TEMP/rebuilt.zip"
          cmp dist/issue-164-experiment-package.zip "$RUNNER_TEMP/rebuilt.zip"
          python -m experiment_compiler verify dist/issue-164-experiment-package.zip --recipe examples/issue-164/experiment.json --receipt dist/verification.json
          sha256sum dist/issue-164-experiment-package.zip > dist/SHA256SUMS
          cat dist/build-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build and exercise installed wheel outside source checkout
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/compiler-install"
          "$RUNNER_TEMP/compiler-install/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/issue-164/experiment.json" --output "$RUNNER_TEMP/installed-poc.zip"
          cmp "$GITHUB_WORKSPACE/dist/issue-164-experiment-package.zip" "$RUNNER_TEMP/installed-poc.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-poc.zip" --recipe "$GITHUB_WORKSPACE/examples/issue-164/experiment.json"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/linear-regression-v1/experiment.json" --output "$RUNNER_TEMP/installed-linear.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-linear.zip" --recipe "$GITHUB_WORKSPACE/examples/linear-regression-v1/experiment.json"
      - name: Retain compiled package, wheel and scoped receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-experiment-poc-python-${{ matrix.python }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30


  standards-validation:
    name: Validate Croissant and RO-Crate metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build the pinned self-contained package
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output "$RUNNER_TEMP/compiled-experiment.zip"
          mkdir -p "$RUNNER_TEMP/compiled-experiment"
          python -m zipfile -e "$RUNNER_TEMP/compiled-experiment.zip" "$RUNNER_TEMP/compiled-experiment"
      - name: Install pinned Croissant validator
        run: python -m pip install --disable-pip-version-check "mlcroissant==1.1.0"
      - name: Validate Croissant 1.1 metadata
        run: mlcroissant validate --jsonld "$RUNNER_TEMP/compiled-experiment/metadata/croissant.jsonld"
      - name: Validate current RO-Crate 1.3 and Process Run Crate 0.6 required contract
        run: python scripts/validate_current_ro_profiles.py "$RUNNER_TEMP/compiled-experiment"
