name: Experiment Compiler lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Protected lifecycle operation
        type: choice
        default: pages
        options: [pages, alpha-provenance]

permissions:
  contents: read

concurrency:
  group: experiment-compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-smoke:
    name: Run the reviewed lifecycle fixture in a bounded worker
    if: inputs.operation != 'alpha-provenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the pinned workflow runner
        run: python -m pip install --disable-pip-version-check '.[runner,repository]' "cwltool==3.2.20260720092025"
      - name: Pre-pull the digest-pinned CWL tool image
        run: docker pull 'python:3.13.13-slim@sha256:7ba5f5888fbe0014ab9edb2278922995c2201fc3752c46b0be24763eb46fa9f3'
      - name: Build the reviewed plan package
        run: |
          set -euo pipefail
          for experiment_id in linear-regression-plan-v1 linear-regression-frozen-lifecycle-v1; do
            python -m experiment_compiler compile "examples/$experiment_id/experiment.json" \
              --output "$RUNNER_TEMP/$experiment_id.plan.zip"
            sha256sum "$RUNNER_TEMP/$experiment_id.plan.zip" > "$RUNNER_TEMP/$experiment_id.plan.sha256"
          done
      - name: Qualify reusable execution and finalization components
        run: bash scripts/check_lifecycle_pipeline.sh
      - name: Retain final package and catalog source closure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-experiment-pipeline-runs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runner-output/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and reproduce Compiled Experiments (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test the core without optional dependencies
        if: matrix.python == '3.12'
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/core-venv"
          "$RUNNER_TEMP/core-venv/bin/python" -m unittest discover -s tests -v
      - name: Install the runner and pinned trajectory verifier dependencies
        run: python -m pip install --disable-pip-version-check '.[runner,trajectory]'
      - name: Offline tests including historical checksum and hostile inputs
        run: python -m unittest discover -s tests -v
      - name: Exercise self-contained scientific source
        run: |
          set -euo pipefail
          cd examples/linear-regression-v1/source
          python reproduce.py --output-dir "$RUNNER_TEMP/source-reproduction"
          cat "$RUNNER_TEMP/source-reproduction/reproduction-receipt.json"

      - name: Compile, verify, extract and independently reproduce compiled-experiment-v1
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output dist/stdlib-linear-regression-v1-compiled-experiment.zip \
            --receipt dist/linear-build-receipt.json
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output "$RUNNER_TEMP/linear-rebuilt.zip"
          cmp dist/stdlib-linear-regression-v1-compiled-experiment.zip "$RUNNER_TEMP/linear-rebuilt.zip"
          python -m experiment_compiler verify dist/stdlib-linear-regression-v1-compiled-experiment.zip \
            --recipe examples/linear-regression-v1/experiment.json \
            --receipt dist/linear-verification.json
          mkdir -p "$RUNNER_TEMP/compiled-experiment"
          python -m zipfile -e dist/stdlib-linear-regression-v1-compiled-experiment.zip "$RUNNER_TEMP/compiled-experiment"
          cd "$RUNNER_TEMP/compiled-experiment/experiment"
          python reproduce.py --output-dir "$RUNNER_TEMP/package-reproduction"
          cmp "$RUNNER_TEMP/package-reproduction/result.json" "$RUNNER_TEMP/compiled-experiment/evidence/expected-result.json"
          cp "$RUNNER_TEMP/package-reproduction/result.json" "$GITHUB_WORKSPACE/dist/linear-reproduction-result.json"
          cp "$RUNNER_TEMP/package-reproduction/reproduction-receipt.json" "$GITHUB_WORKSPACE/dist/linear-reproduction-receipt.json"
          sha256sum "$GITHUB_WORKSPACE/dist/stdlib-linear-regression-v1-compiled-experiment.zip"
          cat "$GITHUB_WORKSPACE/dist/linear-reproduction-receipt.json"

      - name: Compile frozen POC through the reusable component
        uses: ./.github/actions/compile
        with:
          parameters: '{"recipe":"examples/issue-164/experiment.json","output":"dist/issue-164-experiment-package.zip","receipt":"dist/build-receipt.json"}'
      - name: Independently compile the POC again
        uses: ./.github/actions/compile
        with:
          parameters: '{"recipe":"examples/issue-164/experiment.json","output":"${{ runner.temp }}/rebuilt.zip"}'
      - name: Verify through the reusable component
        uses: ./.github/actions/verify
        with:
          parameters: '{"package":"dist/issue-164-experiment-package.zip","recipe":"examples/issue-164/experiment.json","receipt":"dist/verification.json"}'
      - name: Compare exact historical bytes
        run: |
          cmp dist/issue-164-experiment-package.zip "$RUNNER_TEMP/rebuilt.zip"
          sha256sum dist/issue-164-experiment-package.zip > dist/SHA256SUMS
          cat dist/build-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build and exercise installed wheel outside source checkout
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/compiler-install"
          "$RUNNER_TEMP/compiler-install/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/issue-164/experiment.json" --output "$RUNNER_TEMP/installed-poc.zip"
          cmp "$GITHUB_WORKSPACE/dist/issue-164-experiment-package.zip" "$RUNNER_TEMP/installed-poc.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-poc.zip" --recipe "$GITHUB_WORKSPACE/examples/issue-164/experiment.json"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/linear-regression-v1/experiment.json" --output "$RUNNER_TEMP/installed-linear.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-linear.zip" --recipe "$GITHUB_WORKSPACE/examples/linear-regression-v1/experiment.json"
          "$RUNNER_TEMP/compiler-install/bin/experiment-runner" --help
      - name: Retain compiled package, wheel and scoped receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-experiment-poc-python-${{ matrix.python }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check alpha assets for signing
        if: inputs.operation == 'alpha-provenance' && matrix.python == '3.12'
        run: python scripts/stage_alpha_release_assets.py --input dist --output "$RUNNER_TEMP/alpha-assets"
      - name: Retain exact alpha inputs for the signing job
        if: inputs.operation == 'alpha-provenance' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alpha-release-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alpha-assets/
          if-no-files-found: error
          retention-days: 7

  mutation-pilot:
    if: inputs.operation != 'alpha-provenance'
    name: Mutation pilot with standard report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install test dependencies and bounded mutation toolchain
        run: python -m pip install --disable-pip-version-check '.[runner,repository,mutation]' 'hypothesis==6.170.17'
      - name: Check generated runner recovery sequences
        run: python -m unittest discover -s tests -p test_runner_transitions.py -v
      - name: Confirm the repository test suite under pytest
        run: python -m pytest -q tests
      - name: Mutate deterministic resource conversions
        run: |
          irradiate run experiment_compiler/resources.py \
            --report json --output "$RUNNER_TEMP/irradiate-report.json" \
            --verify-survivors --workers 2
      - name: Validate Mutation Testing Elements report
        run: python scripts/validate_mutation_report.py "$RUNNER_TEMP/irradiate-report.json" --require-mutants
      - name: Mutate verifier resource policy and worker admission
        timeout-minutes: 4
        run: |
          # Irradiate 0.4.3 can reuse coverage collected for different paths.
          mv .irradiate "$RUNNER_TEMP/irradiate-resource-cache"
          irradiate run experiment_compiler/archive_policy.py experiment_compiler/worker_limits.py \
            --report json --output "$RUNNER_TEMP/irradiate-admission-report.json" \
            --verify-survivors --workers 2 \
            --pytest-args=-k --pytest-args='archive_policy or verifier_opens_lifecycle or WorkerLimitTests'
      - name: Verify both admission mutation targets
        run: |
          python scripts/validate_mutation_report.py "$RUNNER_TEMP/irradiate-admission-report.json" \
            --require-file experiment_compiler/archive_policy.py \
            --require-file experiment_compiler/worker_limits.py
      - name: Retain standard mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experiment-compiler-mutation-report-${{ github.sha }}
          path: |
            ${{ runner.temp }}/irradiate-report.json
            ${{ runner.temp }}/irradiate-admission-report.json
          if-no-files-found: error
          retention-days: 7

  standards-validation:
    if: inputs.operation != 'alpha-provenance'
    name: Validate Croissant and RO-Crate metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build the pinned self-contained package
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output "$RUNNER_TEMP/compiled-experiment.zip"
          mkdir -p "$RUNNER_TEMP/compiled-experiment"
          python -m zipfile -e "$RUNNER_TEMP/compiled-experiment.zip" "$RUNNER_TEMP/compiled-experiment"
      - name: Install pinned Croissant validator
        run: python -m pip install --disable-pip-version-check "mlcroissant==1.1.0"
      - name: Validate Croissant 1.1 metadata
        run: mlcroissant validate --jsonld "$RUNNER_TEMP/compiled-experiment/metadata/croissant.jsonld"
      - name: Install pinned CWL v1.2 reference implementation
        run: python -m pip install --disable-pip-version-check "cwltool==3.2.20260720092025"
      - name: Validate CWL v1.2 resource fields
        run: cwltool --validate examples/resource-profile/validation-only.cwl
      - name: Validate current RO-Crate 1.3 and Process Run Crate 0.6 required contract
        run: python scripts/validate_current_ro_profiles.py "$RUNNER_TEMP/compiled-experiment"


  site-preview:
    if: inputs.operation != 'alpha-provenance'
    name: Build derived public site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Derive metadata and build static site
        run: |
          set -euo pipefail
          python -m experiment_compiler catalog examples --output "$RUNNER_TEMP/catalog.json"
          python scripts/build_pages_site.py --output "$RUNNER_TEMP/site"
          test "$(jq -r '.experiments | length' "$RUNNER_TEMP/catalog.json")" -ge 1
          jq -e '.experiments[] | select(.package.sha256 == "251a43f8719a17bb0898a5e5e51f4d8c22f9280b29febadd72d98ffbba20e544")' "$RUNNER_TEMP/catalog.json" >/dev/null
          test -f "$RUNNER_TEMP/site/packages/251a43f8719a17bb0898a5e5e51f4d8c22f9280b29febadd72d98ffbba20e544.zip"
      - name: Check narrow catalog and full-protocol layouts
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.55.0"
          python -m playwright install --with-deps chromium
          python scripts/check_site_mobile.py "$RUNNER_TEMP/site"
      - name: Retain site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experiment-compiler-site-${{ github.sha }}
          path: ${{ runner.temp }}/site/
          if-no-files-found: error
          retention-days: 3

  pages:
    name: Deploy GitHub Pages
    needs: [build, standards-validation, site-preview]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'pages'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build derived Pages artifact
        run: python scripts/build_pages_site.py --output "$RUNNER_TEMP/site"
      - name: Independently rebuild every exact publication package
        run: python scripts/check_clean_rebuilds.py --source-commit "$GITHUB_SHA" --site "$RUNNER_TEMP/site" --output "$RUNNER_TEMP/publication-evidence"
      - name: Attach build provenance to the frozen packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/site/packages/*.zip
      - name: Verify signatures before protected publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_publication_attestations.py --source-commit "$GITHUB_SHA" --site "$RUNNER_TEMP/site" --output "$RUNNER_TEMP/publication-evidence"
      - name: Retain clean rebuild and signed provenance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-verification-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/publication-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  alpha-provenance:
    name: Sign and verify alpha release candidates
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.operation == 'alpha-provenance' &&
      github.repository == 'pH34r-pH/experiment-compiler' && github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alpha-release-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alpha-inputs
          digest-mismatch: error
      - name: Verify only the reviewed release asset set
        run: python scripts/stage_alpha_release_assets.py --input "$RUNNER_TEMP/alpha-inputs" --output "$RUNNER_TEMP/alpha-release/assets"
      - name: Attest same-run alpha build subjects
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/alpha-release/assets/*
      - name: Verify every signature against the exact producer
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/alpha-release"
          mkdir "$root/verification"
          for asset in "$root"/assets/*; do
            /usr/bin/gh attestation verify "$asset" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/lifecycle.yml" \
              --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners --hostname github.com \
              --predicate-type https://slsa.dev/provenance/v1 --format json \
              > "$root/verification/$(basename "$asset").json"
          done
          cp -- "$BUNDLE_PATH" "$root/verification/attestation.jsonl"
          (cd "$root/assets" && sha256sum -- *) > "$root/asset-sha256.txt"
      - name: Retain verified alpha candidate and signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-alpha-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alpha-release/
          if-no-files-found: error
          retention-days: 7
