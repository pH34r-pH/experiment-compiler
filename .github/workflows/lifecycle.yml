name: Experiment Compiler lifecycle

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-compiler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-smoke:
    name: Run the reviewed lifecycle fixture in a bounded worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install the pinned workflow runner
        run: python -m pip install --disable-pip-version-check '.[runner]' "cwltool==3.2.20260720092025"
      - name: Pre-pull the digest-pinned CWL tool image
        run: docker pull 'python:3.13.13-slim@sha256:7ba5f5888fbe0014ab9edb2278922995c2201fc3752c46b0be24763eb46fa9f3'
      - name: Build the reviewed plan package
        run: |
          set -euo pipefail
          for experiment_id in linear-regression-plan-v1 linear-regression-frozen-lifecycle-v1; do
            python -m experiment_compiler compile "examples/$experiment_id/experiment.json" \
              --output "$RUNNER_TEMP/$experiment_id.plan.zip"
            sha256sum "$RUNNER_TEMP/$experiment_id.plan.zip" > "$RUNNER_TEMP/$experiment_id.plan.sha256"
          done
      - name: Run package without secrets; cwltool constrains the task container
        run: |
          set -euo pipefail
          TMPFS_ROOT=/mnt/experiment-compiler-cwl
          sudo mkdir -p "$TMPFS_ROOT"
          sudo mount -t tmpfs -o size=64m,mode=1777 tmpfs "$TMPFS_ROOT"
          sudo chown "$(id -u):$(id -g)" "$TMPFS_ROOT"
          TOOL_IMAGE_ID="$(docker image inspect --format '{{.Id}}' 'python:3.13.13-slim@sha256:7ba5f5888fbe0014ab9edb2278922995c2201fc3752c46b0be24763eb46fa9f3')"
          for experiment_id in linear-regression-plan-v1 linear-regression-frozen-lifecycle-v1; do
            output_dir="$RUNNER_TEMP/runner-output/$experiment_id"
            mkdir -p "$output_dir"
            PLAN_SHA256="$(cut -d ' ' -f 1 "$RUNNER_TEMP/$experiment_id.plan.sha256")"
            EXPERIMENT_RUNNER_WORKER_IMAGE="$TOOL_IMAGE_ID" \
            EXPERIMENT_RUNNER_SANDBOX='cwltool DockerExecutor; NetworkAccess=false; strict CPU/RAM; dedicated 64 MiB tmpfs' \
            EXPERIMENT_RUNNER_RESOURCE_LIMITS='{"cores":1,"ramMiB":64,"tmpdirMiB":64,"outdirMiB":64,"wallSeconds":120}' \
            EXPERIMENT_RUNNER_TMPFS_ROOT="$TMPFS_ROOT" \
            TMPDIR="$TMPFS_ROOT" \
              python -m experiment_compiler.runner_cli run "$RUNNER_TEMP/$experiment_id.plan.zip" \
                --output "$output_dir/result.zip" --expected-sha256 "$PLAN_SHA256" --allow-workflow-execution
            sha256sum -c "$RUNNER_TEMP/$experiment_id.plan.sha256"
            python -m experiment_compiler verify "$output_dir/result.zip" --recipe "$output_dir/result.source/experiment.json"
            python scripts/validate_current_ro_profiles.py "$output_dir/result.source"
            python -m experiment_compiler catalog "$output_dir/result.source" --output "$output_dir/catalog.json"
            PACKAGE_PATH="$output_dir/result.zip" CATALOG_PATH="$output_dir/catalog.json" python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ["PACKAGE_PATH"])) as archive:
              receipt = next(name for name in archive.namelist() if name.endswith("/runner-receipt.json"))
              details = json.loads(archive.read(receipt))
              assert details["status"] == "succeeded", details
              assert details["exitCode"] == 0, details
              assert details["planPackageSha256"]
              assert details["outputs"]
              assert details["workerContext"]["reportedImageId"].startswith("sha256:")
              assert "NetworkAccess=false" in details["workerContext"]["reportedSandbox"]
          catalog = json.loads(Path(os.environ["CATALOG_PATH"]).read_text())
          assert catalog["experiments"][0]["lifecycle"]["attemptCount"] == 1
          assert catalog["experiments"][0]["lifecycle"]["processRunCrate"] is True
          print(json.dumps(details, indent=2))
          PY
          done
      - name: Retain final package and catalog source closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-experiment-pipeline-runs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runner-output/
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build and reproduce Compiled Experiments (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the runner's bounded YAML parser dependency
        run: python -m pip install --disable-pip-version-check '.[runner]'
      - name: Offline tests including historical checksum and hostile inputs
        run: python -m unittest discover -s tests -v
      - name: Exercise self-contained scientific source
        run: |
          set -euo pipefail
          cd examples/linear-regression-v1/source
          python reproduce.py --output-dir "$RUNNER_TEMP/source-reproduction"
          cat "$RUNNER_TEMP/source-reproduction/reproduction-receipt.json"

      - name: Compile, verify, extract and independently reproduce compiled-experiment-v1
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output dist/stdlib-linear-regression-v1-compiled-experiment.zip \
            --receipt dist/linear-build-receipt.json
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output "$RUNNER_TEMP/linear-rebuilt.zip"
          cmp dist/stdlib-linear-regression-v1-compiled-experiment.zip "$RUNNER_TEMP/linear-rebuilt.zip"
          python -m experiment_compiler verify dist/stdlib-linear-regression-v1-compiled-experiment.zip \
            --recipe examples/linear-regression-v1/experiment.json \
            --receipt dist/linear-verification.json
          mkdir -p "$RUNNER_TEMP/compiled-experiment"
          python -m zipfile -e dist/stdlib-linear-regression-v1-compiled-experiment.zip "$RUNNER_TEMP/compiled-experiment"
          cd "$RUNNER_TEMP/compiled-experiment/experiment"
          python reproduce.py --output-dir "$RUNNER_TEMP/package-reproduction"
          cmp "$RUNNER_TEMP/package-reproduction/result.json" "$RUNNER_TEMP/compiled-experiment/evidence/expected-result.json"
          cp "$RUNNER_TEMP/package-reproduction/result.json" "$GITHUB_WORKSPACE/dist/linear-reproduction-result.json"
          cp "$RUNNER_TEMP/package-reproduction/reproduction-receipt.json" "$GITHUB_WORKSPACE/dist/linear-reproduction-receipt.json"
          sha256sum "$GITHUB_WORKSPACE/dist/stdlib-linear-regression-v1-compiled-experiment.zip"
          cat "$GITHUB_WORKSPACE/dist/linear-reproduction-receipt.json"

      - name: Build twice and compare exact published POC
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/issue-164/experiment.json --receipt dist/build-receipt.json
          python -m experiment_compiler compile examples/issue-164/experiment.json --output "$RUNNER_TEMP/rebuilt.zip"
          cmp dist/issue-164-experiment-package.zip "$RUNNER_TEMP/rebuilt.zip"
          python -m experiment_compiler verify dist/issue-164-experiment-package.zip --recipe examples/issue-164/experiment.json --receipt dist/verification.json
          sha256sum dist/issue-164-experiment-package.zip > dist/SHA256SUMS
          cat dist/build-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build and exercise installed wheel outside source checkout
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/compiler-install"
          "$RUNNER_TEMP/compiler-install/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/issue-164/experiment.json" --output "$RUNNER_TEMP/installed-poc.zip"
          cmp "$GITHUB_WORKSPACE/dist/issue-164-experiment-package.zip" "$RUNNER_TEMP/installed-poc.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-poc.zip" --recipe "$GITHUB_WORKSPACE/examples/issue-164/experiment.json"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" compile "$GITHUB_WORKSPACE/examples/linear-regression-v1/experiment.json" --output "$RUNNER_TEMP/installed-linear.zip"
          "$RUNNER_TEMP/compiler-install/bin/experiment-compiler" verify "$RUNNER_TEMP/installed-linear.zip" --recipe "$GITHUB_WORKSPACE/examples/linear-regression-v1/experiment.json"
          "$RUNNER_TEMP/compiler-install/bin/experiment-runner" --help
      - name: Retain compiled package, wheel and scoped receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiled-experiment-poc-python-${{ matrix.python }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30


  standards-validation:
    name: Validate Croissant and RO-Crate metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build the pinned self-contained package
        run: |
          set -euo pipefail
          python -m experiment_compiler compile examples/linear-regression-v1/experiment.json \
            --output "$RUNNER_TEMP/compiled-experiment.zip"
          mkdir -p "$RUNNER_TEMP/compiled-experiment"
          python -m zipfile -e "$RUNNER_TEMP/compiled-experiment.zip" "$RUNNER_TEMP/compiled-experiment"
      - name: Install pinned Croissant validator
        run: python -m pip install --disable-pip-version-check "mlcroissant==1.1.0"
      - name: Validate Croissant 1.1 metadata
        run: mlcroissant validate --jsonld "$RUNNER_TEMP/compiled-experiment/metadata/croissant.jsonld"
      - name: Install pinned CWL v1.2 reference implementation
        run: python -m pip install --disable-pip-version-check "cwltool==3.2.20260720092025"
      - name: Validate CWL v1.2 resource fields
        run: cwltool --validate examples/resource-profile/validation-only.cwl
      - name: Validate current RO-Crate 1.3 and Process Run Crate 0.6 required contract
        run: python scripts/validate_current_ro_profiles.py "$RUNNER_TEMP/compiled-experiment"


  site-preview:
    name: Build derived public site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Derive metadata and build static site
        run: |
          set -euo pipefail
          python -m experiment_compiler catalog examples --output "$RUNNER_TEMP/catalog.json"
          python scripts/build_pages_site.py --output "$RUNNER_TEMP/site"
          test "$(jq -r '.experiments | length' "$RUNNER_TEMP/catalog.json")" -ge 1
          jq -e '.experiments[] | select(.package.sha256 == "251a43f8719a17bb0898a5e5e51f4d8c22f9280b29febadd72d98ffbba20e544")' "$RUNNER_TEMP/catalog.json" >/dev/null
          test -f "$RUNNER_TEMP/site/packages/251a43f8719a17bb0898a5e5e51f4d8c22f9280b29febadd72d98ffbba20e544.zip"
      - name: Retain site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experiment-compiler-site-${{ github.sha }}
          path: ${{ runner.temp }}/site/
          if-no-files-found: error
          retention-days: 14

  pages:
    name: Deploy GitHub Pages
    needs: [build, standards-validation, site-preview]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build derived Pages artifact
        run: python scripts/build_pages_site.py --output "$RUNNER_TEMP/site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
