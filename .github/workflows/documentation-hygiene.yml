name: Documentation hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Changed living Markdown and artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then base="HEAD^"; fi
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi
      - name: Run changed-file documentation and artifact hygiene
        run: python scripts/docs_hygiene.py --changed-since '${{ steps.base.outputs.sha }}'
      - name: Run hygiene regression tests
        run: python scripts/test_docs_hygiene.py
      - name: Select changed living Markdown
        id: files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/docs_hygiene.py --changed-since '${{ steps.base.outputs.sha }}' --list-living-docs > "$RUNNER_TEMP/changed-living-docs.txt"
          if [[ -s "$RUNNER_TEMP/changed-living-docs.txt" ]]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Markdown style (pinned markdownlint-cli2)
        if: steps.files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          npx --yes markdownlint-cli2@0.18.1 --config .markdownlint-cli2.yaml "${docs[@]}"
      - name: Install pinned lychee
        if: steps.files.outputs.any == 'true'
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          lycheeVersion: v0.20.1
          args: --version
          failIfEmpty: false
      - name: Prove lychee rejects a broken local link
        if: steps.files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/experiment-compiler-broken-link.md"
          printf '%s\n' '[broken](missing-local-target.md)' > "$fixture"
          if lychee --offline --no-progress --include-fragments --root-dir "$RUNNER_TEMP" "$fixture"; then
            echo 'lychee unexpectedly accepted a broken local link' >&2
            exit 1
          fi
      - name: Check actual relative links in changed living Markdown
        if: steps.files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          lychee --offline --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${docs[@]}"
