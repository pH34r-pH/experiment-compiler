[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-compiler"
version = "0.1.0a1"
description = "Offline deterministic packaging for standards-based Compiled Experiments"
readme = "README.md"
requires-python = ">=3.11.4"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Tyler J.H.G."}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
runner = ["PyYAML==6.0.2"]
repository = ["jsonschema==4.25.1"]
trajectory = [
  "jsonschema==4.25.1",
  "long-haul @ git+https://github.com/pH34r-pH/long-haul@64c81d31fc8193cd2ff9e96a8df1751f86f8a21c",
]
mutation = [
  "irradiate==0.4.3",
  "jsonschema>=4.25,<5",
  "pytest>=8,<10",
]
testgen = [
  "hypothesis[cli]>=6,<7",
  "pynguin==0.47.0",
  "pytest>=8,<10",
]

[project.scripts]
experiment-compiler = "experiment_compiler.__main__:main"
experiment-runner = "experiment_compiler.runner_cli:main"

[project.urls]
Repository = "https://github.com/pH34r-pH/experiment-compiler"
Issues = "https://github.com/pH34r-pH/experiment-compiler/issues"

[tool.setuptools.packages.find]
include = ["experiment_compiler*"]

[tool.setuptools.package-data]
experiment_compiler = ["profiles/*.json"]

[tool.mypy]
files = [
  "experiment_compiler/archive_policy.py",
  "experiment_compiler/core.py",
  "experiment_compiler/resources.py",
  "experiment_compiler/worker_limits.py",
]
python_version = "3.11"
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true


[tool.irradiate]
paths_to_mutate = "experiment_compiler"
tests_dir = "tests"
pytest_add_cli_args = ["-q"]
